syntax = "proto3";

package sarnaut.v1;

import "sarnaut/v1/movement.proto";
import "sarnaut/v1/replication.proto";

option go_package = "github.com/SarnautCore/server/gen/sarnaut/v1;sarnautv1";
option csharp_namespace = "Sarnaut.Protocol.V1";

// Every post-handshake frame in either direction is a ClientMessage or a
// ServerMessage and nothing else, on either carrier: a datagram carries a whole
// envelope, not a bare submessage (ADR 0026).
//
// Payload field numbers start at 10 so envelope-level fields can grow in the
// 1-9 block. A retired case is reserved; case numbers are never renumbered or
// reused. Adding a case is an additive change that does not bump
// ProtocolVersion (ADR 0027).

message ClientMessage {
  uint64 client_seq = 1;
  oneof payload {
    ClientMoveIntent move_intent = 10;
    AbilityUse ability_use = 11;
    Interact interact = 12;
    LootTake loot_take = 13;
    QuestAccept quest_accept = 14;
    QuestTurnIn quest_turn_in = 15;
    QuestAbandon quest_abandon = 16;
    Logout logout = 17;
  }
}

message ServerMessage {
  uint64 server_tick = 1;
  oneof payload {
    SnapshotBatch snapshot_batch = 10;
    CombatEvent combat_event = 11;
    DeathEvent death_event = 12;
    LootOffer loot_offer = 13;
    LootResult loot_result = 14;
    InventoryUpdate inventory_update = 15;
    QuestStateUpdate quest_state_update = 16;
    Error error = 17;
    SpawnEvent spawn_event = 18;
    DespawnEvent despawn_event = 19;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNSUPPORTED_MESSAGE = 1;
  ERROR_CODE_MALFORMED_PAYLOAD = 2;
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_NOT_IN_ZONE = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_PACK_MISMATCH = 6;
  ERROR_CODE_INTERNAL = 7;
}

// Error is a typed refusal, never a bare string. It always travels on the
// reliable channel.
message Error {
  ErrorCode code = 1;
  string detail = 2;
}

// SpawnEvent announces that one entity entered this session's replication
// interest set. It travels reliably, unlike the lossy snapshots that carry
// the entity's subsequent latest-value state.
message SpawnEvent {
  EntitySnapshot entity = 1;
}

// DespawnEvent announces that one entity left this session's replication
// interest set. A missing snapshot entry cannot substitute for this event:
// the snapshot may simply have been dropped or stalled.
message DespawnEvent {
  uint64 entity_id = 1;
}

// AbilityUse activates the caster's ability against one target. caster_id is
// advisory and ignored: the server derives the actor from the session
// (session.md rule 5.2.6). Shape fixed by mechanics/combat.md section 4.
message AbilityUse {
  uint64 caster_id = 1;
  uint64 target_id = 2;
  uint64 client_tick = 3;

  // Canonical id of the ability, resolved against the runtime pack both peers
  // agreed on in the handshake (ADR 0029). combat.md section 4 omits it
  // because M2's worked example has exactly one ability; carrying it is what
  // lets a second ability be pure content rather than a wire change.
  // Empty selects the caster's first known ability.
  string ability_id = 4;
}

// Interact is the generic "use the thing I am looking at" verb: quest starters
// and finishers, and corpses before looting.
message Interact {
  uint64 target_entity_id = 1;
}

// LootTake asks for the whole drop on one corpse. Looting is all or nothing
// (mechanics/loot.md rule 5.6.3), so there is no per-item selector.
message LootTake {
  uint64 corpse_entity_id = 1;
}

message QuestAccept {
  string quest_id = 1;
  uint64 starter_entity_id = 2;
}

message QuestTurnIn {
  string quest_id = 1;
  uint64 finisher_entity_id = 2;
}

// QuestAbandon drives mechanics/quests.md transitions T14 and T15, which were
// specified before any client verb could reach them (2026-08-20 amendment to
// ADR 0026).
message QuestAbandon {
  string quest_id = 1;
}

// Logout is a clean exit. It exists so the session's save checkpoint runs
// before the connection goes away rather than racing it (2026-08-20 amendment
// to ADR 0026). It carries no fields: the actor is the session.
message Logout {}

// AbilityRejection names why an ability use resolved to nothing.
//
// It is not an ErrorCode. An ErrorCode is a protocol violation and closes the
// connection; casting at a target that walked out of range is ordinary play
// and must leave the session running (mechanics/combat.md rules 5.2 to 5.4).
enum AbilityRejection {
  ABILITY_REJECTION_UNSPECIFIED = 0;
  // The ability resolved and did damage.
  ABILITY_REJECTION_NONE = 1;
  // rule 5.2.2: target_id is zero or names no entity in the caster's zone.
  ABILITY_REJECTION_NO_TARGET = 2;
  // rules 5.2.3 and 5.2.5: not a combatant, the caster itself, a returning
  // mob, or a faction that is not hostile to the caster.
  ABILITY_REJECTION_INVALID_TARGET = 3;
  // rule 5.2.4.
  ABILITY_REJECTION_TARGET_DEAD = 4;
  // rule 5.3.2.
  ABILITY_REJECTION_OUT_OF_RANGE = 5;
  // rule 5.4.1, and the per-ability cooldown the pack may carry.
  ABILITY_REJECTION_ON_COOLDOWN = 6;
  // The caster does not know the ability, or the pack does not carry it.
  ABILITY_REJECTION_UNKNOWN_ABILITY = 7;
}

// CombatEvent reports one resolved or refused ability use
// (mechanics/combat.md sections 5.5 and 5.6). It always travels on the
// reliable channel.
message CombatEvent {
  uint64 caster_id = 1;
  uint64 target_id = 2;
  string ability_id = 3;
  // Damage dealt after mitigation, rule 5.5.5. Zero on a rejection.
  int32 damage = 4;
  // The target's health after rule 5.6.1, so a client that dropped a snapshot
  // datagram still draws the right health bar.
  int32 target_health = 5;
  int32 target_max_health = 6;
  // True on the use that brought target_health to zero.
  bool killing_blow = 7;
  // ABILITY_REJECTION_NONE on a use that resolved. Anything else means no
  // world state changed and no cooldown was consumed (rule 6.2).
  AbilityRejection rejection = 8;
}

// DeathEvent is the client projection of the server-internal MobKilled event
// (mechanics/combat.md rule 5.9.3). victim_content_id is deliberately absent:
// it is content identity the client has no business inferring kill credit
// from.
message DeathEvent {
  uint64 victim_entity_id = 1;
  // The entity credited with the killing blow, rule 5.9.2.
  uint64 killer_entity_id = 2;
  uint32 victim_level = 3;
  // Server tick at which the corpse disappears, rule 5.9.4.
  uint64 corpse_despawn_tick = 4;
}

// LootRefusal names why a loot verb resolved to nothing.
//
// Like AbilityRejection it is not an ErrorCode. Opening somebody else's corpse
// or arriving at one with a full bag is ordinary play and must leave the
// session running (mechanics/loot.md rules 5.6.3 and 5.8.2); an ErrorCode is a
// protocol violation and closes the connection.
enum LootRefusal {
  LOOT_REFUSAL_UNSPECIFIED = 0;
  // The verb resolved.
  LOOT_REFUSAL_NONE = 1;
  // The entity named is not a corpse container in this zone, or has already
  // despawned (rule 5.1.2).
  LOOT_REFUSAL_NO_CORPSE = 2;
  // rule 5.8.2: the corpse is credited to another character.
  LOOT_REFUSAL_NOT_YOUR_LOOT = 3;
  // rule 5.6.4: the drop was taken and the corpse is standing but empty.
  LOOT_REFUSAL_ALREADY_LOOTED = 4;
  // rule 5.6.3. Nothing was inserted, no money was credited, and the corpse
  // still holds the whole drop.
  LOOT_REFUSAL_BAG_FULL = 5;
  // A take on this corpse is already committing. A retransmit lands here.
  LOOT_REFUSAL_IN_PROGRESS = 6;
  // The award could not be committed. The corpse is intact.
  LOOT_REFUSAL_INTERNAL = 7;
}

// LootItem is one item id and the count rolled for it. It is the roll's output
// (mechanics/loot.md section 4's ItemGrant), not a bag slot: duplicates are not
// merged and stack limits have not been applied yet.
message LootItem {
  string item_id = 1;
  int32 count = 2;
}

// LootOffer is what is on a corpse, answering ClientMessage.interact.
//
// The drop is rolled at corpse creation and fixed before it is observable
// (rule 5.1.1), so what an offer reports is what a take will produce.
message LootOffer {
  uint64 corpse_entity_id = 1;
  // Purse credit. Money occupies no bag slot (rule 5.6.1).
  int64 money = 2;
  repeated LootItem items = 3;
}

// LootResult answers ClientMessage.loot_take.
//
// On LOOT_REFUSAL_NONE it is written after the award is committed to storage
// (protocol/session.md rule 5.7.4), so a crash in that window replays as "you
// already have it" rather than as a lost item. On any other refusal nothing was
// written at all.
message LootResult {
  uint64 corpse_entity_id = 1;
  LootRefusal refusal = 2;
  // What was taken. Empty on a refusal.
  int64 money = 3;
  repeated LootItem items = 4;
}

// InventorySlot is one occupied bag slot after stack splitting (rule 5.7).
message InventorySlot {
  int32 slot = 1;
  string item_id = 2;
  // 1 <= count <= the item's stack_limit.
  int32 count = 3;
}

// InventoryUpdate is the character's whole bag and purse.
//
// It is a full replacement rather than a delta. M2's only writer is the
// all-or-nothing loot take of rule 5.6.3, a bag is sixteen slots, and a delta
// protocol would be a second thing that can disagree with the database for no
// bandwidth anyone will notice.
message InventoryUpdate {
  repeated InventorySlot slots = 1;
  int64 currency = 2;
}

// QuestState is the state machine of mechanics/quests.md rule 5.1.
//
// `unavailable` and `offered` are carried even though no instance exists in
// either: the update that clears an offer marker has to say what it cleared it
// to, and a client that only ever heard about quests it holds could not draw
// the marker in the first place.
enum QuestState {
  QUEST_STATE_UNSPECIFIED = 0;
  // The gates of rule 5.3 fail. No instance exists.
  QUEST_STATE_UNAVAILABLE = 1;
  // The gates pass and the starter will hand it over. No instance exists yet.
  QUEST_STATE_OFFERED = 2;
  // Accepted, every counter zero.
  QUEST_STATE_ACCEPTED = 3;
  // At least one counter above zero and at least one below its limit.
  QUEST_STATE_IN_PROGRESS = 4;
  // Every counter has reached its limit.
  QUEST_STATE_COMPLETABLE = 5;
  // Terminal. Rewards granted.
  QUEST_STATE_TURNED_IN = 6;
  // Terminal for this instance; the quest may be offered again.
  QUEST_STATE_ABANDONED = 7;
}

// QuestRefusal names why a quest verb resolved to nothing.
//
// Like AbilityRejection and LootRefusal it is not an ErrorCode. An ErrorCode is
// a protocol violation and closes the connection; walking up to a finisher with
// a full bag, or clicking accept twice, is ordinary play and must leave the
// session running (mechanics/quests.md transitions T4, T12 and T13).
enum QuestRefusal {
  QUEST_REFUSAL_UNSPECIFIED = 0;
  // The verb resolved.
  QUEST_REFUSAL_NONE = 1;
  // The runtime pack carries no quest with that id.
  QUEST_REFUSAL_UNKNOWN_QUEST = 2;
  // Rule 5.3: a prerequisite is unfinished, the required level is not met, or
  // an instance already exists. T4.
  QUEST_REFUSAL_UNAVAILABLE = 3;
  // Rule 5.2 T3: the quest log is at QUEST_LOG_CAPACITY.
  QUEST_REFUSAL_LOG_FULL = 4;
  // Further than TURN_IN_RANGE_M from the NPC. T4, T13.
  QUEST_REFUSAL_OUT_OF_RANGE = 5;
  // The entity named is not this quest's starter, or not its finisher. T13.
  QUEST_REFUSAL_WRONG_NPC = 6;
  // A turn-in before every counter reached its limit.
  QUEST_REFUSAL_NOT_COMPLETE = 7;
  // T17: the quest is already turned in. A retransmit lands here, and it
  // grants nothing.
  QUEST_REFUSAL_ALREADY_COMPLETE = 8;
  // Rule 5.7.3. No experience, no money, no items, and the instance is
  // unchanged. T12.
  QUEST_REFUSAL_BAG_FULL = 9;
  // T15: the definition sets can_cancel false.
  QUEST_REFUSAL_CANNOT_CANCEL = 10;
  // The grant could not be committed. Nothing was applied. T12.
  QUEST_REFUSAL_INTERNAL = 11;
}

// QuestObjectiveProgress is one counter of one quest instance
// (mechanics/quests.md rule 5.5.7).
//
// `index` is the objective's position in the definition, which is the counter's
// identity (rule 7.5). Objectives marked `internal` never appear here.
message QuestObjectiveProgress {
  uint32 index = 1;
  int32 counter = 2;
  int32 limit = 3;
  // Render `n / limit` rather than a plain incomplete marker.
  bool show_count = 4;
  // Localization key of the counter's display name (ADR 0007).
  string counter_key = 5;
}

// QuestStateUpdate is the server's report of one quest instance changing state.
// It is named for the message, not for the QuestState enum in
// mechanics/quests.md rule 5.1; the wire case is quest_state_update so the two
// never collide (2026-08-20 amendment to ADR 0026).
//
// It is only ever written to the character the quest belongs to. A quest log is
// nobody else's business, and unlike a snapshot there is no radius at which it
// becomes public.
message QuestStateUpdate {
  string quest_id = 1;
  QuestState state = 2;
  repeated QuestObjectiveProgress objectives = 3;
  // QUEST_REFUSAL_NONE on an update that reports a real transition. Anything
  // else means nothing changed and names why.
  QuestRefusal refusal = 4;

  // What a turn-in granted. Zero and empty on every other update, including a
  // refused turn-in: rule 5.7.6 leaves no partial grant to report.
  int64 experience = 5;
  int64 money = 6;
  int64 honor = 7;
  // Reward items, as ids and counts. LootItem is reused because that is
  // exactly what it is — an item id and a count, not a bag slot — and the
  // slots the grant actually produced arrive in the InventoryUpdate that
  // follows.
  repeated LootItem items = 8;
}
