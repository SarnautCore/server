syntax = "proto3";

package sarnaut.v1;

import "sarnaut/v1/movement.proto";

option go_package = "github.com/SarnautCore/server/gen/sarnaut/v1;sarnautv1";
option csharp_namespace = "Sarnaut.Protocol.V1";

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
}

enum AnimationState {
  ANIMATION_STATE_UNSPECIFIED = 0;
  ANIMATION_STATE_IDLE = 1;
  ANIMATION_STATE_MOVING = 2;
}

message EntitySnapshot {
  uint64 entity_id = 1;
  EntityKind kind = 2;
  Vec3 position = 3;
  float heading = 4;
  Vec3 velocity = 5;
  AnimationState animation_state = 6;

  // Identity and combat state. content_id and name_key are content references
  // resolved against the runtime pack both peers agreed on in the handshake
  // (ADR 0029); the client never receives display strings on the wire
  // (ADR 0007). level, health, max_health and alive are the Combatant fields
  // mechanics/combat.md section 4 defines, replicated so nameplates and target
  // frames need no second round trip.
  string content_id = 7;
  string name_key = 8;
  uint32 level = 9;
  string faction = 10;
  int32 health = 11;
  int32 max_health = 12;
  bool alive = 13;
}

message SnapshotBatch {
  uint64 server_tick = 1;
  repeated EntitySnapshot entities = 2;

  // Datagram chunking (protocol/session.md rule 5.5.7). A snapshot too large for
  // one datagram is split into chunk_count parts that all carry the same
  // server_tick, and a receiver must hold them until it has all chunk_count of
  // them before publishing the tick: a chunk on its own is a fragment of the
  // world, not a view of it, and acting on one alone despawns every entity that
  // landed in a sibling chunk.
  //
  // chunk_count is 1 for a whole snapshot, including every batch on the reliable
  // fallback, so the receiving rule is uniform rather than conditional on the
  // carrier. chunk_index is 0-based and the chunks of one tick partition its
  // entities in order.
  uint32 chunk_index = 3;
  uint32 chunk_count = 4;
}

message EnterZoneRequest {
  string zone_id = 1;

  // The opaque single-use shard ticket minted by auth for one
  // (account_id, character_id) pair (ADR 0030). It rides EnterZoneRequest
  // rather than ClientHello because the ticket already names the character, so
  // a separate authenticate message would carry nothing new
  // (protocol/session.md rule 5.2.2).
  string ticket = 2;
}

message EnterZoneResponse {
  string zone_id = 1;
  uint64 own_entity_id = 2;
  Vec3 spawn_position = 3;
}
