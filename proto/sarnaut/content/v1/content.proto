// Row messages for the compiled runtime pack format (ADR 0029).
//
// This package is deliberately separate from the wire contract `sarnaut.v1`:
// content rows carry fields no client ever sees, and binding them to the wire
// evolution rules of ADR 0027 would be wrong.
//
// This file is the canonical definition. `tools` (the pack writer) and `server`
// (the pack reader) each vendor a copy for a hermetic build; those copies name
// this file as their source and must be kept identical to it.
syntax = "proto3";

package sarnaut.content.v1;

option go_package = "github.com/SarnautCore/server/gen/sarnaut/content/v1;contentv1";

// RowType identifies the message stored in a `.sptbl` table.
//
// The numeric value is written into the table header as `row_type_id` and is
// checked against the `row_type` name recorded in the pack manifest.
enum RowType {
  ROW_TYPE_UNSPECIFIED = 0;
  ROW_TYPE_ZONE = 1;
  ROW_TYPE_PLACEMENT = 2;
  ROW_TYPE_SPAWN_TABLE = 3;
  ROW_TYPE_CHARGEN_OPTION = 4;
  ROW_TYPE_ABILITY = 5;
  ROW_TYPE_FACTION = 6;
  ROW_TYPE_MOB = 7;
  ROW_TYPE_ITEM = 8;
  ROW_TYPE_LOOT_TABLE = 9;
  ROW_TYPE_QUEST = 10;
  ROW_TYPE_ROUTE = 11;
  ROW_TYPE_LOCALE = 12;
  ROW_TYPE_MOB_KIND = 13;
  ROW_TYPE_LEVEL_CURVE = 14;
}

// Vec3 is a world-space position. Z is the vertical axis.
message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// Zone is the single row of the `zone` table: what the shard needs to stand a
// zone up before any entity exists.
message Zone {
  // Canonical id, for example `zone.inst-league1`.
  string id = 1;
  // `classic` or `modern`.
  string ruleset = 2;
  // Zone slug, for example `inst-league1`.
  string slug = 3;
  // Where an entering player is placed. A zone document is authoritative for
  // this; a pack whose source tree has no zone document falls back to the
  // first live placement, which is deterministic but arbitrary.
  Vec3 player_spawn = 4;
  // Facing of an entering player, in radians.
  float player_spawn_heading = 5;
  // Localization keys for the display name and description (ADR 0007).
  string name_key = 6;
  string description_key = 7;
  // Map slugs this zone is built from. Every route and placements document in
  // the zone names one of them.
  repeated string maps = 8;
  // The axis-aligned box a player may occupy. A position outside it is a bug,
  // not a place. Both unset means the source authored no bounds.
  Vec3 bounds_min = 9;
  Vec3 bounds_max = 10;
  uint32 level_min = 11;
  uint32 level_max = 12;
  bool instanced = 13;
  uint32 max_players = 14;
  // Untyped passthrough, present only in a `keep_extra` pack. Values are
  // JSON-encoded. See ADR 0029 and ADR 0011.
  map<string, string> extra = 15;
  // Which map the player spawn sits on.
  string spawn_map = 16;
  // Canonical id of the level curve this zone's mobs scale against
  // (mechanics/combat.md section 7.1). Empty when the source tree authors none.
  string level_curve_id = 17;
}

// Placement is one authored object instance on a map.
message Placement {
  // Canonical id, for example
  // `spawn.inst-league1.placement.000-020.1-2-server-objects.11`.
  string id = 1;
  // What is placed: a mob id (`mob.…`) or a spawn table id (`spawn.….table.…`).
  string object_id = 2;
  Vec3 position = 3;
  // Yaw of the authored orientation, in radians.
  float heading = 4;
  // Authored spawn schedule slug. `time-never` means the placement is inert.
  string spawn_time = 5;
  // Server script hook name, verbatim from the authored document.
  string script_id = 6;
  // Canonical id of the patrol route this placement follows, if any.
  string route_id = 7;
  float scan_radius = 8;
  // Respawn delay window for whatever this placement spawns, in milliseconds.
  // The shard draws uniformly from `[min, max]` (mechanics/combat.md rule
  // 5.9.6). Respawn is a property of the slot, not of the mob: the same mob
  // placed twice can come back at two different rates. Both zero means the
  // placement authored none and the shard uses its own default.
  uint32 respawn_delay_min_ms = 9;
  uint32 respawn_delay_max_ms = 10;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// SpawnTableEntry is one candidate object of a spawn table.
message SpawnTableEntry {
  // Canonical id of the spawned object.
  string object_id = 1;
  // Authored selection group, for example `commons`.
  string group = 2;
  float chance = 3;
  // Authored spawn schedule slug. `time-never` means the entry is inert.
  string spawn_time = 4;
}

// SpawnTable is an indirection from a placement to the objects it may spawn.
message SpawnTable {
  // Canonical id, for example `spawn.inst-league1.table.air-elemental`.
  string id = 1;
  repeated SpawnTableEntry entries = 2;
  // True when the authored table is driven by a server script.
  bool scripted = 3;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// AbilityEffect is one effect an ability applies to its target.
//
// `kind` and `element` are authored slugs rather than enums: the effect
// taxonomy is not settled (mechanics/combat.md is explicit that M2's rules are
// invented), and freezing an enum now would make every later effect a wire
// change. The shard rejects a kind it does not implement.
message AbilityEffect {
  // `damage` or `heal`.
  string kind = 1;
  // Damage school slug, for example `physical`.
  string element = 2;
  // Flat term of the effect. ABILITY_BASE_DAMAGE in combat.md rule 5.5.1.
  float amount = 3;
  // Multiplier on the caster's attack power. ATTACK_POWER_COEFF in rule 5.5.1.
  float attack_power_coeff = 4;
}

// Ability is one activatable ability, keyed by canonical id.
message Ability {
  // Canonical id, for example `ability.melee.harbor-cleave`.
  string id = 1;
  // Who the ability may be used on. `enemy` is the only value M2 authors.
  string target = 2;
  // Maximum caster-to-target distance. Units are metres by assumption; see
  // mechanics/combat.md section 7.2.
  float range_m = 3;
  uint32 cast_time_ms = 4;
  // Per-ability cooldown, separate from the global cooldown.
  uint32 cooldown_ms = 5;
  bool triggers_gcd = 6;
  repeated AbilityEffect effects = 7;
  // Localization key for the display name (ADR 0007).
  string name_key = 8;
  // Localization key for the tooltip description (ADR 0007).
  string description_key = 9;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// FactionRelation is one directed stance. A hostile to B does not imply B
// hostile to A, so both directions are stored.
message FactionRelation {
  string faction_id = 1;
  // `hostile`, `neutral` or `friendly`.
  string stance = 2;
}

// Faction is a hostility table entry. Without it a mob's faction is a string
// the shard cannot reason about, and combat.md rule 5.2.5 has nothing to read.
message Faction {
  // Canonical id, for example `faction.wild`.
  string id = 1;
  bool player_faction = 2;
  // Whether members may be the target of a hostile ability at all.
  bool attackable = 3;
  // Stance towards any faction with no explicit relation.
  string default_stance = 4;
  repeated FactionRelation relations = 5;
  string name_key = 6;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// Mob is what the shard needs to instantiate one creature: identity, the
// combat inputs of mechanics/combat.md section 4, and the ids that later
// systems resolve.
message Mob {
  // Canonical id, for example `mob.paper-harbor.tide-crab`.
  string id = 1;
  string name_key = 2;
  // Canonical id of the faction this mob belongs to.
  string faction_id = 3;
  // Canonical id of the MobKind this mob's `hp_mod` was resolved from, kept so
  // a shard log can name the record a number came from.
  string mob_kind_id = 4;
  // Inclusive level draw window (combat.md rule 5.1.5).
  uint32 level_min = 5;
  uint32 level_max = 6;
  float walk_speed = 7;
  // Health multiplier resolved from the referenced MobKind. Zero means the
  // record carried none and the shard uses 1.0 (combat.md rule 5.1.1). The
  // wider multiplier chain is deferred by combat.md section 7.1.
  float hp_mod = 8;
  // Distance at which an idle mob pulls (combat.md rule 5.7.2).
  float aggro_radius_m = 9;
  // Distance from its anchor at which a chasing mob gives up (rule 5.8.2).
  float leash_radius_m = 10;
  repeated string ability_ids = 11;
  string loot_table_id = 12;
  // Localization key for the display title, the subtitle a client renders
  // under the name (ADR 0007).
  string title_key = 13;
  // Canonical id of the MobQuality this mob was authored with.
  string quality_id = 14;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
  // Rank of the referenced MobQuality. Zero means the record carried none.
  uint32 quality_rank = 16;
  // The rest of the multiplier set carried by the MobKind named in
  // `mob_kind_id`, copied through exactly as `hp_mod` is: the record's own
  // value, with no prototype walk and no product across kind, class and
  // quality. mechanics/combat.md section 7.1 defers that chain, and the
  // `mob_kinds` table carries every record's own numbers so a shard can
  // resolve it without the compiler guessing. Zero means the record carried
  // none.
  float dps_mod = 17;
  float exp_mod = 18;
  float mana_mod = 19;
  float loot_mod = 20;
  float speed_mod = 21;
  // Canonical id of the MobClass the referenced MobKind belongs to.
  string mob_class_id = 22;
}

// StatEntry is one authored starting stat, mirroring `statEntry` in
// `common.schema.json`.
message StatEntry {
  // Canonical stat name, for example `strength`.
  string stat = 1;
  float value = 2;
}

// LoadoutEntry is one item a character of a chargen option starts with.
message LoadoutEntry {
  // Canonical item id, for example `item.consumable.harbor-tonic`.
  string item_id = 1;
  uint32 quantity = 2;
  // An equipment slot, or `bag` for anything not equipped at first spawn.
  string slot = 3;
}

// ChargenOption is one selectable character-creation option (ADR 0032).
//
// Every starting item, stat, ability and spawn coordinate is a field here
// precisely so that none of them lives in client or server source: adding the
// second playable option is a data change, not a rebuild.
message ChargenOption {
  // Canonical id, for example `chargen.league.warrior`.
  string id = 1;
  // Canonical race id, for example `race.human`.
  string race = 2;
  // Canonical class id, for example `class.warrior`.
  string class = 3;
  // The body variant this option renders with: `female` or `male`. It is a
  // property of the option, not a customization axis (ADR 0032 section 4).
  string sex = 4;
  // Canonical faction id, for example `faction.league`.
  string faction = 5;
  // Whether the option may be offered. Options that are not playable yet ship
  // with `enabled: false` rather than being absent.
  bool enabled = 6;
  // Localization keys for the display name and description (ADR 0007).
  string name_key = 7;
  string description_key = 8;
  // The model and material every character of this option renders with.
  string visual_ref = 9;
  // Where a fresh character of this option is placed.
  string spawn_zone_id = 10;
  Vec3 spawn_position = 11;
  // Facing of a fresh character, in the unit the authored document uses.
  float spawn_heading = 12;
  uint32 starting_level = 13;
  repeated StatEntry starting_stats = 14;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
  repeated LoadoutEntry starting_loadout = 16;
  // Canonical ability ids granted at creation.
  repeated string starting_abilities = 17;
  // Canonical quest ids granted at first spawn.
  repeated string starting_quests = 18;
}

// Item is one item definition: the fields the shard needs to hold an item
// instance in a bag, and nothing else.
//
// `stack_limit` is the load-bearing one. mechanics/loot.md rule 5.7.1 says the
// limit is per-item content and never a constant, so it is a field here rather
// than a number in Go, and rule 5.7.6 makes a limit of 1 a legal value rather
// than a missing one.
message Item {
  // Canonical id, for example `item.consumable.harbor-tonic`.
  string id = 1;
  // Localization key for the display name (ADR 0007).
  string name_key = 2;
  // Authored category slug, for example `consumable`.
  string category = 3;
  uint32 level = 4;
  uint32 required_level = 5;
  // Maximum units in one stack. Zero means the authored record carried none,
  // which the shard reads as unstackable (loot.md rule 5.7.6).
  int32 stack_limit = 6;
  int64 vendor_sell = 7;
  int64 vendor_buy = 8;
  // Localization key for the tooltip description (ADR 0007).
  string description_key = 9;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// LootNodeKind names one node of a loot tree (mechanics/loot.md section 4).
//
// It is an enum rather than the authored slug that abilities use, because
// unlike an effect kind this taxonomy is closed: the reference set contains
// these four node types and no others, and a fifth would be a new evaluation
// rule rather than new content.
enum LootNodeKind {
  LOOT_NODE_KIND_UNSPECIFIED = 0;
  LOOT_NODE_KIND_AND = 1;
  LOOT_NODE_KIND_OR = 2;
  LOOT_NODE_KIND_SINGLE_ITEM = 3;
  LOOT_NODE_KIND_MONEY = 4;
}

// LootNode is one node of a loot tree, carrying its children inline.
//
// `entries` and `chances` are positionally paired and must be the same length;
// nothing in the authored file links entry `i` to chance `i` other than ordinal
// position, so the pairing is preserved as two parallel arrays rather than
// being folded into one message. The reader enforces the length equality.
//
// `chances` is `double`, not `float`. Reference chances are written with eight
// significant digits — `0.00618751` is one of them — and narrowing to binary32
// would change the number between the authored document and the evaluator.
message LootNode {
  LootNodeKind kind = 1;
  repeated LootNode entries = 2;
  repeated double chances = 3;
  // Canonical item id. Set on a SINGLE_ITEM leaf and empty everywhere else: a
  // MONEY leaf has no item reference at all (loot.md rule 5.6.1).
  string item_id = 4;
  // Inclusive count bounds of a leaf. `max_number >= min_number` is enforced by
  // the reader.
  int32 min_number = 5;
  int32 max_number = 6;
}

// LootTable is one tree with exactly one root node.
message LootTable {
  // Canonical id, for example `loot.fixture.m2-nested`.
  string id = 1;
  LootNode root = 2;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// MobTaxonomyKind names which of the three creature-taxonomy record types a
// `mob_kinds` row came from.
//
// They share one table because they share one shape — a set of multipliers and
// a link to the record above them — and because a shard resolving a mob's
// numbers walks between them. Splitting them into three tables would mean
// three lookups to answer one question.
enum MobTaxonomyKind {
  MOB_TAXONOMY_KIND_UNSPECIFIED = 0;
  MOB_TAXONOMY_KIND_KIND = 1;
  MOB_TAXONOMY_KIND_CLASS = 2;
  MOB_TAXONOMY_KIND_QUALITY = 3;
}

// MobKind is one creature-taxonomy record: a MobKind, a MobClass or a
// MobQuality.
//
// Every multiplier here is the record's **own** declared value, never a
// product and never inherited from `prototype_id`. mechanics/combat.md section
// 7.1 defers the resolution order of the chain, so the compiler ships the
// links and the raw numbers and lets the shard decide. A field left at zero
// means the authored record declared none, which is distinguishable from a
// declared 0.0 only by reading the source document — an acceptable loss,
// because a multiplier of exactly zero is not a value any reference record
// carries.
message MobKind {
  // Canonical id, for example `mobkind.creatures.zombie-warrior.zombie-warrior-start-inst-kind`.
  string id = 1;
  MobTaxonomyKind taxonomy = 2;
  // The record this one inherits from, if any.
  string prototype_id = 3;
  string mob_class_id = 4;
  string quality_id = 5;
  float hp_mod = 6;
  float dps_mod = 7;
  float exp_mod = 8;
  float mana_mod = 9;
  float loot_mod = 10;
  float speed = 11;
  // Ordinal of a MobQuality record; zero on every other taxonomy kind.
  uint32 rank = 12;
  string name_key = 13;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// LevelCurvePoint is the base stat line of one level, before any MobKind
// multiplier applies.
message LevelCurvePoint {
  uint32 level = 1;
  int32 base_hp = 2;
  float base_dps = 3;
  int64 base_experience = 4;
}

// LevelCurve is the per-level base HP/DPS/XP table that MobKind multipliers
// scale.
//
// mechanics/combat.md section 7.1 settled that this curve is **absent from the
// source content tree** and is a curated SarnautCore constant. It is a table
// here rather than two constants in Go so that changing it is a data change,
// which is what that section asks for when it says the two-parameter form
// "graduates to a curated constant table shipped in DATA:".
message LevelCurve {
  // Canonical id, for example `levelcurve.classic.mob-base`.
  string id = 1;
  // `classic` or `modern`.
  string ruleset = 2;
  // Ascending by `level`, one point per level, no gaps.
  repeated LevelCurvePoint points = 3;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// RoutePoint is one waypoint of a patrol route.
message RoutePoint {
  uint32 index = 1;
  Vec3 position = 2;
}

// RouteLink is one directed edge between two waypoints.
message RouteLink {
  uint32 from = 1;
  uint32 to = 2;
  float weight = 3;
  // Authored movement slug, for example `walk`.
  string movement = 4;
  bool flying = 5;
}

// Route is one patrol path a placement can follow.
message Route {
  // Canonical id, for example `route.inst-league1.000-020.1-2-server-objects.4`.
  string id = 1;
  string zone_id = 2;
  // Map slug the route was authored on.
  string map = 3;
  repeated RoutePoint points = 4;
  repeated RouteLink links = 5;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// LocaleEntry is one localization key and its text in one language.
message LocaleEntry {
  string key = 1;
  string text = 2;
}

// Locale is every string of one language, as one row.
//
// One row per document rather than one row per key, because a locale key is
// not a canonical id — reference keys are source-tree paths with slashes and
// mixed case — and the `.sptbl` key index is defined over canonical ids. The
// shard builds its own key map once at load.
message Locale {
  // Canonical id, for example `locale.ru.inst-league1`.
  string id = 1;
  // BCP-47-ish language tag as authored, for example `en` or `ru`.
  string language = 2;
  // Sorted by `key`, bytewise ascending.
  repeated LocaleEntry entries = 3;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
}

// QuestObjectiveKind names one countable goal shape
// (mechanics/quests.md rule 5.5).
//
// Unlike an ability effect kind this is a closed set: reference data in the M2
// zone contains these three and no others, and `COUNT_SPECIAL` is carried
// rather than dropped precisely so the shard can refuse it loudly (rule
// 5.5.6) instead of silently loading a quest that can never complete.
enum QuestObjectiveKind {
  QUEST_OBJECTIVE_KIND_UNSPECIFIED = 0;
  QUEST_OBJECTIVE_KIND_COUNT_KILL = 1;
  QUEST_OBJECTIVE_KIND_COUNT_ITEM = 2;
  QUEST_OBJECTIVE_KIND_COUNT_SPECIAL = 3;
}

// QuestObjective is one countable goal. Position in `Quest.objectives` is the
// counter index (quests.md rule 7.5).
message QuestObjective {
  QuestObjectiveKind kind = 1;
  // Inclusive target count. Zero is satisfied on creation (rule 5.5.8).
  int32 limit = 2;
  // Content ids; any one of them counts.
  repeated string target_ids = 3;
  // Hidden from the client's quest log.
  bool internal = 4;
  // Render `n / limit` rather than a plain incomplete marker.
  bool show_count = 5;
  // Localization key of the counter's display name (ADR 0007).
  string counter_key = 6;
  // Destroy the tracked items when the quest is abandoned (rule 5.5.5).
  bool remove_on_abandon = 7;
}

// QuestPrerequisite is one gate on offering a quest (quests.md rule 5.3.3).
message QuestPrerequisite {
  string quest_id = 1;
  // Authored status name. `Finished` is the only value M2 accepts.
  string required_status = 2;
}

// QuestRewardItem is one item a turn-in grants.
message QuestRewardItem {
  string item_id = 1;
  int32 count = 2;
  // Not shown in the offer text.
  bool hidden = 3;
}

// QuestRewards is the whole grant, applied together or not at all
// (quests.md rule 5.7).
message QuestRewards {
  int64 experience = 1;
  int64 money = 2;
  int64 honor = 3;
  // Always granted.
  repeated QuestRewardItem mandatory_items = 4;
  // Offered as a choice. M2 grants a flat list and does not implement the
  // choice; quests.md section 7.2 owns that gap.
  repeated QuestRewardItem alternative_items = 5;
}

// Quest is one immutable quest definition (mechanics/quests.md section 4).
message Quest {
  // Canonical id, for example `quest.inst-league1.quest-1-10`.
  string id = 1;
  string zone_id = 2;
  uint32 level = 3;
  // Zero means no level gate (quests.md rule 5.3.2).
  uint32 required_level = 4;
  // Authored quest-type slug, for example `quest-type-solo`.
  string quest_type = 5;
  // Canonical id of the NPC that offers the quest.
  string starter_id = 6;
  // Canonical id of the NPC that accepts the turn-in. Not necessarily the
  // starter, and not necessarily in this zone.
  string finisher_id = 7;
  bool can_cancel = 8;
  repeated QuestPrerequisite prerequisites = 9;
  repeated QuestObjective objectives = 10;
  QuestRewards rewards = 11;
  // Localization keys (ADR 0007).
  string name_key = 12;
  string goal_key = 13;
  string start_key = 14;
  // Untyped passthrough; see Zone.extra.
  map<string, string> extra = 15;
  string check_key = 16;
  string finish_key = 17;
}
