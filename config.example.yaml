build_id: dev
log_level: info

quic:
  listen_address: 127.0.0.1:4242
  shard_address: 127.0.0.1:4242

world:
  zone_id: InstLeague1
  tick_interval: 33.333333ms
  snapshot_interval: 66.666666ms
  max_move_speed: 7

# The compiled runtime pack this shard serves: a directory holding manifest.json
# and tables/, produced by `sarnaut-pack build`. There is no default and no
# fallback; SARNAUT_CONTENT_PACK overrides this value. Packs built from the
# private data repository are private artifacts and are never committed here.
content:
  pack_path: ""
  # Refuse packs built with --keep-extra unless this is true. Those carry
  # verbatim MY.GAMES attribute names, so keep it off outside mapping work.
  allow_extra: false

# Leave these empty to run without the Docker-managed development services.
nats:
  url: ""

postgres:
  dsn: ""

valkey:
  address: ""
  password: ""
  db: 0

otel:
  endpoint: ""
  insecure: true
