build_id: dev
log_level: info

quic:
  listen_address: 127.0.0.1:4242
  shard_address: 127.0.0.1:4242

world:
  zone_id: InstLeague1
  tick_interval: 33.333333ms
  snapshot_interval: 66.666666ms
  max_move_speed: 7
  # The per-shard-instance half of the loot roll seed (mechanics/loot.md rule
  # 5.2.4). It is configuration and not a process-start value on purpose: a
  # restart that changed it would change the drop every corpse in the zone
  # would have produced. Give two instances of the same zone two values.
  world_seed: sarnaut-shard

# The compiled runtime pack this shard serves: a directory holding manifest.json
# and tables/, produced by `sarnaut-pack build`. There is no default and no
# fallback; SARNAUT_CONTENT_PACK overrides this value. Packs built from the
# private data repository are private artifacts and are never committed here.
content:
  pack_path: ""
  # Refuse packs built with --keep-extra unless this is true. Those carry
  # verbatim MY.GAMES attribute names, so keep it off outside mapping work.
  allow_extra: false
  # Admit a client whose ClientHello names no pack at all (protocol/session.md
  # rule 5.1.4). A client that names a *different* pack is refused either way.
  # Turn it on for a dev shard talking to a client that has not shipped a pack of
  # its own yet; leave it off anywhere a wrong content table would be expensive
  # to diagnose, which is everywhere else.
  allow_unverified_pack: false

# `auth` and `shard` require all three of these and refuse to start without
# them: accounts and character state have nowhere else to live (ADR 0031), and
# sessions, tickets and play locks have no fallback (ADR 0030). The gateway
# still runs with them empty.
nats:
  url: ""

postgres:
  dsn: ""

valkey:
  address: ""
  password: ""
  db: 0

auth:
  # The account HTTP API, on its own listener rather than the health one.
  listen_address: 127.0.0.1:8083
  # Normalized substrings a character name may not contain (ADR 0032 section 3).
  # M2 ships impersonation prefixes and nothing else: real moderation policy is
  # not an M2 problem, and a half-hearted profanity list is worse than an honest
  # empty one.
  name_blocklist: [gm, admin, sarnaut]
  # This shard's play-lock holder id. Empty derives one from the host name and
  # pid, so two shards on one host do not claim to be each other.
  instance_id: ""
  # One shard-to-auth request, with no retry: a retried ticket redemption cannot
  # succeed after the service has burned it.
  request_timeout: 2s

otel:
  endpoint: ""
  insecure: true
