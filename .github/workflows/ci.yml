name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated protobuf code
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          export PATH="$RUNNER_TEMP/protoc/bin:$(go env GOPATH)/bin:$PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go generate ./proto
          git diff --exit-code -- gen

      - name: Check the proto lock
        shell: pwsh
        run: ./scripts/proto-lock.ps1 -Check

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/...

      # ADR 0029: no pack committed to a public repository may carry the untyped
      # `extra:` passthrough, whose keys are verbatim MY.GAMES attribute names.
      - name: Check the vendored fixture pack
        shell: pwsh
        run: ./scripts/check-fixture-pack.ps1

      # The M2 vertical slice, played headlessly against the vendored fixture
      # pack: connect, enter, target, cast, kill, loot. It stands its own shard
      # up in process, so it needs nothing running. Every later M2 server task
      # adds a step to it rather than writing a driver of its own.
      - name: Run the M2 slice driver
        run: go run ./scripts/m2-slice-driver

  # The persistence suite needs a real PostgreSQL: the character-name unique
  # index, citext, transaction rollback and every migration's Down section are
  # database behaviour, and a fake proves none of them (ADR 0031).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches infra/compose/docker-compose.yml: postgres:18, user and
        # database sarnaut, published on 5433 so the DSN is the same string a
        # developer already has.
        image: postgres:18
        env:
          POSTGRES_DB: sarnaut
          POSTGRES_USER: sarnaut
          POSTGRES_PASSWORD: sarnaut_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sarnaut -d sarnaut"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    env:
      SARNAUT_POSTGRES_DSN: postgres://sarnaut:sarnaut_dev@127.0.0.1:5433/sarnaut?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Up, down to nothing, then up again. Reversibility is a promise the ADR
      # makes on every migration, and this is the only thing that keeps it true.
      - name: Migrate up, down to zero, and up again
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down-to 0
          go run ./cmd/migrate up
          go run ./cmd/migrate status

      # `internal/auth` joins the store here because what its integration
      # tests cover is the database's behaviour, not the service's: the citext
      # unique index on email, the unique index on name_normalized that decides
      # NAME_TAKEN, and the soft delete that keeps a name taken. An in-memory
      # store can imitate all three, and imitating them is not evidence.
      #
      # `internal/loot` joins for the same reason: what it asserts here is that
      # a loot award's bag write and purse credit are one PostgreSQL
      # transaction, and that the bag a player looted is still there after a
      # disconnect and a reconnect.
      #
      # `-p 1` is load-bearing, not tidiness. `go test` runs one test binary per
      # package concurrently, both packages share this one database, and
      # `internal/charstore` truncates `auth.accounts` and `auth.characters` between
      # its own cases. Run concurrently, that truncate lands in the middle of an
      # `internal/auth` case and the account it just registered stops
      # existing: the failure surfaces as `Login() error = invalid credentials`
      # or an empty character roster, on unchanged code.
      # `internal/session` joins for the third instance of the same reason: what
      # its quest test asserts is that a turn-in's item write, currency credit
      # and quest row are one PostgreSQL transaction, that the jsonb counters of
      # `shard.character_quests` round-trip, and that a reconnected session
      # reads back `turned-in` rather than being offered the quest again.
      - name: Integration tests
        run: |
          go test -tags=integration -count=1 -p 1 \
            ./internal/charstore/... ./internal/auth/... ./internal/loot/... ./internal/session/...
